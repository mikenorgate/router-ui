name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
permissions:
  contents: write
jobs:
  artifacts:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm test --prefix web
      - run: npm run build --prefix web
      - run: go test -race -tags=integration ./...
      - run: go vet -tags=integration ./...
      - name: Build inert packages and archives
        run: |
          version="${RELEASE_TAG#v}"
          bash scripts/package.sh "$version" amd64
          bash scripts/package.sh "$version" arm64
          cp dist/*.deb dist/*.tar.gz "$RUNNER_TEMP/"
          bash scripts/package.sh "$version" amd64
          bash scripts/package.sh "$version" arm64
          for artifact in dist/*.deb dist/*.tar.gz; do cmp "$artifact" "$RUNNER_TEMP/$(basename "$artifact")"; done
          bash scripts/security.sh "$version"
          python3 scripts/release-evidence.py "$version"
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" dist/* --prerelease --verify-tag --generate-notes
