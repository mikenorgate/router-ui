<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Lanrith console: investigate router observations, devices and installed policy." />
    <link rel="icon" href="../design/assets/lanrith-favicon.svg" type="image/svg+xml" />
    <title>Lanrith console</title>
    <script>
      try { document.documentElement.dataset.theme = localStorage.getItem('console-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
      catch { document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
